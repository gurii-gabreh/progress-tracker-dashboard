name: Sync Claude permissions allowlist

on:
  push:
    branches: ["main"]
    paths:
      - "data/claude-permissions.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync permissions allowlist to managed repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: python3 scripts/sync_claude_permissions.py

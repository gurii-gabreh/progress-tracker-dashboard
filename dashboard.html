<title>実装進捗ダッシュボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --surface-2: #eceef3;
    --border: #dcdfe6;
    --text: #1b1e27;
    --text-muted: #5b6172;
    --accent: #33449c;
    --accent-soft: #e4e7fb;
    --knowledge-bg: #fbf9f0;
    --knowledge-border: #e6dfc2;
    --status-done-bg: #e1f5ec;
    --status-done-fg: #157a4a;
    --status-doing-bg: #e4edfd;
    --status-doing-fg: #2054c4;
    --status-todo-bg: #eceef3;
    --status-todo-fg: #5b6172;
    --status-skip-bg: #fdf0e0;
    --status-skip-fg: #a05a08;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --surface: #1b1e27; --surface-2: #22252f; --border: #30333e;
      --text: #e7e8ee; --text-muted: #969cab; --accent: #8fa1ff; --accent-soft: #262b45;
      --knowledge-bg: #232016; --knowledge-border: #47401f;
      --status-done-bg: #143528; --status-done-fg: #4fd399;
      --status-doing-bg: #17263f; --status-doing-fg: #7fabfd;
      --status-todo-bg: #22252f; --status-todo-fg: #969cab;
      --status-skip-bg: #3a2a10; --status-skip-fg: #f0a94e;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --surface: #1b1e27; --surface-2: #22252f; --border: #30333e;
    --text: #e7e8ee; --text-muted: #969cab; --accent: #8fa1ff; --accent-soft: #262b45;
    --knowledge-bg: #232016; --knowledge-border: #47401f;
    --status-done-bg: #143528; --status-done-fg: #4fd399;
    --status-doing-bg: #17263f; --status-doing-fg: #7fabfd;
    --status-todo-bg: #22252f; --status-todo-fg: #969cab;
    --status-skip-bg: #3a2a10; --status-skip-fg: #f0a94e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --bg: #f3f4f7; --surface: #ffffff; --surface-2: #eceef3; --border: #dcdfe6;
    --text: #1b1e27; --text-muted: #5b6172; --accent: #33449c; --accent-soft: #e4e7fb;
    --knowledge-bg: #fbf9f0; --knowledge-border: #e6dfc2;
    --status-done-bg: #e1f5ec; --status-done-fg: #157a4a;
    --status-doing-bg: #e4edfd; --status-doing-fg: #2054c4;
    --status-todo-bg: #eceef3; --status-todo-fg: #5b6172;
    --status-skip-bg: #fdf0e0; --status-skip-fg: #a05a08;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.06);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5; padding: 24px 0 64px;
  }

  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 0 16px; }

  header { display: flex; flex-direction: column; gap: 4px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .header-actions { display: flex; gap: 6px; }
  header .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .settings-btn {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer;
  }
  .settings-btn:hover { border-color: var(--accent); color: var(--accent); }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
  header .meta { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  header .meta a { color: var(--accent); text-decoration: none; }
  header .meta a:hover { text-decoration: underline; }
  .settings-caption { font-size: 11px; color: var(--text-muted); }

  .stat-strip {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 12px; box-shadow: var(--shadow);
  }
  .stat-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
  .stat-row .name { flex: 0 0 auto; font-size: 12px; font-weight: 700; min-width: 150px; }
  .stat-row .bar-track {
    flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden;
  }
  .stat-row .bar-fill { height: 100%; border-radius: 999px; }
  .stat-row .pct {
    flex: 0 0 auto; width: 38px; text-align: right;
    font-size: 12px; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700;
  }

  .avatar {
    width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .avatar.lg { width: 34px; height: 34px; border-radius: 8px; font-size: 15px; }
  .avatar.sm { width: 24px; height: 24px; border-radius: 6px; font-size: 11px; }

  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    cursor: pointer;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .feed {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .task-group { border-bottom: 1px solid var(--border); }
  .task-group:last-child { border-bottom: none; }

  .subtask-tabs { display: flex; gap: 6px; padding: 2px 16px 8px 44px; }
  .subtask-tab-btn {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer;
  }
  .subtask-tab-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .empty.small { padding: 10px 16px 14px 44px; font-size: 12px; text-align: left; }

  .feed-row {
    display: flex; gap: 10px; padding: 12px 16px; cursor: default;
  }
  .feed-row.clickable { cursor: pointer; }
  .feed-row.clickable:hover { background: var(--surface-2); }
  .feed-row.child { padding-left: 12px; position: relative; }
  .feed-row.child::before {
    content: ""; position: absolute; left: 33px; top: 0; bottom: 0; width: 1px; background: var(--border);
  }

  .chevron-btn {
    flex: 0 0 auto; width: 22px; height: 22px; border: none; background: none; cursor: pointer;
    color: var(--text-muted); display: flex; align-items: center; justify-content: center;
    font-size: 11px; transition: transform 0.15s ease;
  }
  .chevron-btn.open { transform: rotate(90deg); }
  .chevron-spacer { flex: 0 0 auto; width: 22px; }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .top-line { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .repo-tag { font-weight: 700; font-size: 13px; }
  .type-tag { font-size: 11px; color: var(--text-muted); }
  .subtask-count { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .task-text { font-size: 13.5px; color: var(--text); }
  .task-text.muted { color: var(--text-muted); font-style: italic; }
  .meta-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .meta-line .has-knowledge { color: var(--accent); font-weight: 600; }

  .chip {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.done { background: var(--status-done-bg); color: var(--status-done-fg); }
  .chip.doing { background: var(--status-doing-bg); color: var(--status-doing-fg); }
  .chip.todo { background: var(--status-todo-bg); color: var(--status-todo-fg); }
  .chip.skip { background: var(--status-skip-bg); color: var(--status-skip-fg); }
  .chip.manual-setup { background: var(--status-skip-bg); color: var(--status-skip-fg); }

  .manual-setup-panel {
    margin: 0 16px 12px 44px; padding: 10px 12px; border-radius: 8px;
    background: var(--status-skip-bg); border: 1px solid var(--status-skip-fg);
    font-size: 12.5px; color: var(--text); display: flex; flex-direction: column; gap: 4px;
  }
  .manual-setup-panel .m-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--status-skip-fg); }
  .manual-setup-panel .m-body { white-space: pre-wrap; }

  .comment-thread {
    margin: 0 16px 12px 44px; padding: 10px 12px; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 12.5px; color: var(--text); display: flex; flex-direction: column; gap: 8px;
  }
  .comment-thread .c-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
  .comment-list { display: flex; flex-direction: column; gap: 6px; }
  .comment-bubble { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; border-radius: 8px; max-width: 90%; }
  .comment-bubble.user { align-self: flex-end; background: var(--accent-soft); }
  .comment-bubble.routine { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
  .comment-bubble .c-meta { font-size: 10px; color: var(--text-muted); font-weight: 600; }
  .comment-bubble .c-text { white-space: pre-wrap; }
  .comment-empty { font-size: 11.5px; color: var(--text-muted); }
  .comment-form { display: flex; gap: 6px; }
  .comment-form textarea {
    flex: 1; min-height: 34px; max-height: 120px; resize: vertical; padding: 6px 9px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  .comment-send-btn {
    font-size: 12px; font-weight: 600; padding: 0 14px; border-radius: 8px;
    border: none; background: var(--accent); color: #fff; cursor: pointer; flex: 0 0 auto;
  }
  .comment-send-btn:disabled { opacity: 0.5; cursor: default; }
  .comment-hint { font-size: 10.5px; color: var(--text-muted); }
  .meta-line .has-comments { color: var(--accent); }

  .knowledge-panel {
    margin: 0 16px 12px 44px; padding: 10px 12px; border-radius: 8px;
    background: var(--knowledge-bg); border: 1px solid var(--knowledge-border);
    font-size: 12.5px; color: var(--text); display: flex; flex-direction: column; gap: 6px;
  }
  .knowledge-panel .k-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
  .knowledge-panel .k-detail { white-space: pre-wrap; }
  .knowledge-panel .k-issues {
    white-space: pre-wrap; padding: 6px 8px; border-radius: 6px;
    background: var(--status-skip-bg); color: var(--status-skip-fg);
  }
  .knowledge-panel .k-issues-label { font-size: 10px; font-weight: 700; margin-bottom: 2px; }
  .knowledge-panel .k-note { color: var(--text-muted); }
  .knowledge-panel .k-output a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .knowledge-panel .k-output a:hover { text-decoration: underline; }

  .empty { padding: 28px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  footer { color: var(--text-muted); font-size: 12px; text-align: center; padding-top: 4px; }

  .handoff-btn {
    font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer;
  }
  .handoff-btn:hover { background: var(--accent-soft); }

  .urgent-btn {
    font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--status-skip-fg); background: transparent; color: var(--status-skip-fg); cursor: pointer;
  }
  .urgent-btn:hover { background: var(--status-skip-bg); }
  .urgent-flag { color: var(--status-skip-fg); font-weight: 700; }

  .add-task-btn {
    font-size: 11px; font-weight: 600; padding: 1px 9px; border-radius: 999px;
    border: 1px dashed var(--text-muted); background: transparent; color: var(--text-muted); cursor: pointer;
    margin-left: auto;
  }
  .add-task-btn:hover { border-color: var(--accent); color: var(--accent); }

  .chip.new { background: var(--accent-soft); color: var(--accent); }

  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .form-field input[type="text"], .form-field select, .form-field textarea {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .form-error { font-size: 12px; color: var(--status-skip-fg); }
  .settings-note {
    font-size: 12px; color: var(--text-muted); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .settings-note p { margin: 0; }
  .settings-note b { color: var(--text); }
  .modal-submit-btn {
    font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 8px;
    border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  .modal-submit-btn:disabled { opacity: 0.6; cursor: default; }
  .modal-cancel-btn {
    font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20, 20, 25, 0.5);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); max-width: 560px; width: 100%; max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .modal-header h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .modal-close {
    border: none; background: none; color: var(--text-muted); font-size: 18px; cursor: pointer;
    width: 28px; height: 28px; border-radius: 6px; flex: 0 0 auto;
  }
  .modal-close:hover { background: var(--surface-2); }
  .modal-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .modal-body textarea {
    width: 100%; min-height: 260px; resize: vertical; font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px; line-height: 1.6; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .modal-copy-btn {
    font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 8px;
    border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  .modal-copy-btn.copied { background: var(--status-done-fg); }
</style>

<div class="wrap">
  <header>
    <div class="header-top">
      <div class="eyebrow">Progress Tracker</div>
      <div class="header-actions">
        <button class="settings-btn" id="refresh-btn" title="スプレッドシートの依頼タスクタブを取得し、未反映のタスクを一覧に追加します">🔄 更新</button>
        <button class="settings-btn" id="open-settings-btn" title="実行頻度・時刻の変更依頼文を作成します(自動反映ではありません)">⚙ Routine設定</button>
      </div>
    </div>
    <h1>実装進捗ダッシュボード</h1>
    <div class="meta">
      最終更新: <span id="updated-at">2026-07-30</span> ・
      データ元: <a href="https://docs.google.com/spreadsheets/d/1679CPPuWq4lciwe4BsJTfjJpiZKvKWogETwtauPThYw/edit" target="_blank" rel="noopener">実装進捗管理シート</a>
    </div>
    <div class="settings-caption">「Routine設定」は変更依頼文を作成するだけです。コピーしてClaude Codeのチャットに貼ると実際に反映されます。</div>
  </header>

  <div id="stat-strip" class="stat-strip"></div>
  <div id="filter-row" class="filter-row"></div>
  <div id="feed" class="feed"></div>

  <footer>Routineが定期実行のたびにこのダッシュボードを更新します・タスクをクリックすると実装ナレッジを表示</footer>
</div>

<div id="modal-root"></div>

<script>
  // データはRoutine実行のたびにここを更新する(スプレッドシートの内容と同期)
  // Repo欄が既知のリポジトリ名ならコード実装タスク、それ以外(例: 調査, 資料作成)は調査・資料作成タスクとして扱う
  // 各タスクは note(短い備考/スキップ理由) と detail(ナレッジ用の実装詳細) を持てる。
  // issues: 実装中に発生した問題点・制約・未解決事項(detailの本文に埋め込まず、ここに分けて書く)。
  // manualSetup: タスク完了後に人が手動で行う必要がある設定・作業がある場合、その内容を書く(例:
  // 「APIキーをスクリプトプロパティに設定」「GitHub PagesのSourceをGitHub Actionsに設定」等)。
  // 設定されていると、detailを開かなくても一覧上で⚠バッジと内容がそのまま見える。
  // comments: タスクごとの簡易チャットスレッド。[{author: "user"|"routine", text, at}]の配列。
  // 人がエラー報告・追加指示・完了報告などをタスク単位で書き込め、Routineは次回実行時にこれを読んで
  // 反映し、対応内容を routine側の発言として追記する想定。
  // 親タスクは subtasks配列を持つことで、その下に子タスクをぶら下げられる。
  const KNOWN_REPOS = ["progress-tracker-dashboard", "kizashi", "supermarket-price-tracker", "gemini-monitor"];

  const TASKS = [
    {
      repo: "progress-tracker-dashboard", task: "初期セットアップ", priority: "高", status: "完了",
      updated: "2026-07-26", note: "", detail: "", output: "",
      subtasks: [
        {
          task: "スプレッドシート作成", priority: "高", status: "完了", updated: "2026-07-26", note: "",
          detail: "Google Driveに「実装進捗管理シート」を作成(CSVアップロードでGoogle Sheetsに変換)。列: Repo, Task, 優先度, ステータス, 最終更新日時, 備考。Google DriveコネクタにはファイルのUPDATE手段が無いため、既存シートへの書き込みはできない前提で設計。そのためシートは人がタスクを追加する「入力専用」とし、ステータスの正本はリポジトリ内のdata/tasks.jsonに置くことにした。",
          output: "https://docs.google.com/spreadsheets/d/1679CPPuWq4lciwe4BsJTfjJpiZKvKWogETwtauPThYw/edit"
        },
        {
          task: "ダッシュボード雛形作成", priority: "高", status: "完了", updated: "2026-07-26", note: "",
          detail: "dashboard.htmlをリポジトリ内に作成し、Claude Artifactとして公開。当初はリポジトリ別テーブル表示だったが、Slackのフィードのように「一行1タスク」で読める形が良いとのフィードバックを受けて、フラットなフィード表示に変更。さらに親タスク/子タスクの階層表示と、タスクごとの実装詳細(ナレッジ)をクリックで展開できる形に発展させた。",
          output: "https://claude.ai/code/artifact/b395634a-ff68-44cb-a667-92c53448c992"
        },
        {
          task: "Routine設定", priority: "高", status: "完了", updated: "2026-07-26", note: "",
          detail: "平日9/12/15/18時(JST)に自動実行するRoutineを作成。新規セッションを都度立ち上げる方式だとこの組織ではconnectors(Google Drive等)の権限委譲ができなかったため、このセッション自体を定期的に再開する自己バインド方式(persist_session)に変更して解決。Routineは(1)スプレッドシートの新規タスクをtasks.jsonへ取り込み、(2)Repo欄が既知のリポジトリ名ならコード実装(ブランチ+PR)、それ以外なら調査・資料作成タスクとして処理、(3)問題が起きたタスクはスキップして次へ進む、という設計。",
          output: ""
        },
        {

  const STATUS_CLASS = { "完了": "done", "進行中": "doing", "未着手": "todo", "スキップ": "skip", "新規": "new", "対応中": "doing" };
  const STATUS_ORDER = ["進行中", "対応中", "未着手", "新規", "スキップ", "完了"];

  // ダッシュボードから追加した新規タスクをスプレッドシートの依頼タスクタブへ反映するためのGASエンドポイント。
  // このファイルは公開リポジトリにあるため、このトークンは「追記のみ」の最小権限として運用すること
  // (依頼タスク行の削除・完了シートへの移動など強い操作はこのエンドポイントからは呼び出さない)。
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyBq4sD_LZBbgRhGpYYcDzve3jLOJ0_lrxlT89bFHjFlUWhgO975uArRicaveEJMKP9/exec";
  const GAS_TOKEN = "8a2fad1907b8d935f758ede8f66d05d7";
  const PRIORITY_ORDER = { "高": 0, "中": 1, "低": 2, "-": 3 };

  const REPO_COLORS = {
    "progress-tracker-dashboard": "#33449c",
    "kizashi": "#c2410c",
    "supermarket-price-tracker": "#0f766e",
    "gemini-monitor": "#a21caf",
  };
  const RESEARCH_COLOR = "#7c3aed";

  function isCode(t) { return KNOWN_REPOS.includes(t.repo); }
  function avatarColor(t) { return isCode(t) ? (REPO_COLORS[t.repo] || "#5b6172") : RESEARCH_COLOR; }
  function avatarLabel(t) { return isCode(t) ? "💻" : "📝"; }

  function chip(status) {
    const cls = STATUS_CLASS[status] || "todo";
    return `<span class="chip ${cls}">${status}</span>`;
  }

  function aggregateStatus(t) {
    if (!t.subtasks || !t.subtasks.length) return t.status;
    const statuses = t.subtasks.map(s => s.status);
    if (statuses.every(s => s === "完了")) return "完了";
    if (statuses.some(s => s === "進行中")) return "進行中";
    if (statuses.some(s => s === "未着手")) return statuses.some(s => s === "完了") ? "進行中" : "未着手";
    return "スキップ";
  }

  function sortNodes(list) {
    return [...list].sort((a, b) => {
      const sa = aggregateStatus(a), sb = aggregateStatus(b);
      const s = STATUS_ORDER.indexOf(sa) - STATUS_ORDER.indexOf(sb);
      if (s !== 0) return s;
      return (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9);
    });
  }

  let activeFilter = "all";
  const openGroups = new Set();     // key: group toggle path -> subtasks visible
  const openDetails = new Set();    // key: node path -> knowledge panel visible
  const subtaskTabs = new Map();    // key: parent path -> "pending" | "done" (which subtasks are shown)

  function renderFilters() {
    const row = document.getElementById("filter-row");
    const options = [
      ["all", "すべて"],
      ["code", "💻 コード実装"],
      ["research", "📝 調査・資料作成"],
    ];
    row.innerHTML = options.map(([key, label]) =>
      `<button class="filter-btn${activeFilter === key ? " active" : ""}" data-filter="${key}">${label}</button>`
    ).join("");
    row.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        renderFilters();
        renderFeed();
      });
    });
  }

  function renderStats() {
    const strip = document.getElementById("stat-strip");
    const repos = [...new Set(TASKS.filter(isCode).map(t => t.repo))];
    const rows = repos.map(repo => {
      const t = TASKS.find(t => t.repo === repo);
      const units = t.subtasks && t.subtasks.length ? t.subtasks : [t];
      const total = units.length;
      const done = units.filter(u => u.status === "完了").length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const color = REPO_COLORS[repo] || "#5b6172";
      return `
        <div class="stat-row">
          <div class="avatar" style="background:${color}">${repo.slice(0, 2).toUpperCase()}</div>
          <span class="name">${repo}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <span class="pct">${pct}%</span>
        </div>`;
    });
    strip.innerHTML = rows.join("");
  }

  function knowledgePanel(node) {
    if (!node.note && !node.detail && !node.issues && !node.output) return "";
    return `
      <div class="knowledge-panel">
        <div class="k-label">実装ナレッジ</div>
        ${node.detail ? `<div class="k-detail">${node.detail}</div>` : ""}
        ${node.issues ? `<div class="k-issues"><div class="k-issues-label">⚠ 問題点</div>${node.issues}</div>` : ""}
        ${node.note ? `<div class="k-note">${node.note}</div>` : ""}
        ${node.output ? `<div class="k-output"><a href="${node.output}" target="_blank" rel="noopener">成果物を見る →</a></div>` : ""}
      </div>`;
  }

  function commentThread(node, path, repo) {
    const comments = node.comments || [];
    const list = comments.length
      ? comments.map(c => `
          <div class="comment-bubble ${c.author === "user" ? "user" : "routine"}">
            <div class="c-meta">${c.author === "user" ? "あなた" : "Routine"} ・ ${c.at || ""}</div>
            <div class="c-text">${escapeHtml(c.text)}</div>
          </div>`).join("")
      : `<div class="comment-empty">まだコメントはありません。エラー報告や追加指示、完了報告などを書き込むと、次回のRoutine実行時に読み取られます。</div>`;

    const status = aggregateStatus(node);
    return `
      <div class="comment-thread">
        <div class="c-label">コメント</div>
        <div class="comment-list">${list}</div>
        <div class="comment-form">
          <textarea data-comment-input="${path}" placeholder="例: GASのデプロイ完了しました / この部分は〇〇に変更して"></textarea>
          ${status !== "完了" ? `<button class="urgent-btn" data-comment-urgent="${path}" data-comment-urgent-repo="${repo}" title="入力中のコメントも送信した上で、次回の定期実行を待たず今すぐ実行してほしい旨の依頼文を作成します">⚡ 即実行</button>` : ""}
          <button class="comment-send-btn" data-comment-send="${path}" data-comment-repo="${repo}">送信</button>
        </div>
        <div class="comment-hint">送信 = コメントを記録するだけ ／ 即実行 = 記録した上でRoutineに今すぐの実行を依頼</div>
      </div>`;
  }

  function renderRow(node, path, { child, repo } = {}) {
    const effectiveRepo = repo || node.repo;
    const hasChildren = node.subtasks && node.subtasks.length > 0;
    const hasKnowledge = !!(node.note || node.detail || node.output);
    const isPlaceholder = node.task.startsWith("(");
    const hasDetailSection = hasKnowledge || !isPlaceholder;
    const status = aggregateStatus(node);
    // 未完了(未着手/進行中/スキップ等)のグループは常に展開表示にする(折りたたませない)。
    // 完了済みのグループだけ、手動でシェブロンをトグルして開閉できる。
    const forceOpen = status !== "完了";
    const groupOpen = forceOpen || openGroups.has(path);
    const detailOpen = openDetails.has(path);

    let html = `<div class="feed-row${hasDetailSection ? " clickable" : ""}${child ? " child" : ""}" data-detail-toggle="${hasDetailSection ? path : ""}">`;
    if (hasChildren && forceOpen) {
      html += `<div class="chevron-spacer" title="未完了のタスクがあるため常に展開表示">▾</div>`;
    } else if (hasChildren) {
      html += `<button class="chevron-btn${groupOpen ? " open" : ""}" data-group-toggle="${path}">▶</button>`;
    } else {
      html += `<div class="chevron-spacer"></div>`;
    }
    html += `<div class="avatar ${child ? "sm" : "lg"}" style="background:${avatarColor(node)}">${avatarLabel(node)}</div>`;
    html += `<div class="content">`;
    html += `<div class="top-line">`;
    if (!child) html += `<span class="repo-tag">${node.repo}</span><span class="type-tag">${isCode(node) ? "コード実装" : "調査・資料作成"}</span><button class="add-task-btn" data-add-parent="${path}" data-add-repo="${node.repo}">＋ 新規タスク</button>`;
    if (hasChildren) html += `<span class="subtask-count">${node.subtasks.filter(s => s.status === "完了").length}/${node.subtasks.length} 完了</span>`;
    html += `</div>`;
    html += `<div class="task-text${isPlaceholder ? " muted" : ""}">${node.urgent ? '<span class="urgent-flag">⚡ 即実行 </span>' : ""}${node.task}</div>`;
    html += `<div class="meta-line">${chip(status)}`;
    if (node.manualSetup) html += `<span class="chip manual-setup">⚠ 手動設定が必要</span>`;
    if (node.priority !== "-") html += `<span>優先度: ${node.priority}</span>`;
    if (node.updated !== "-") html += `<span>${node.updated}</span>`;
    if (hasDetailSection) {
      const commentCount = (node.comments || []).length;
      const label = detailOpen ? "閉じる ▲" : `コメント${commentCount ? `(${commentCount})` : ""}・ナレッジ ▼`;
      html += `<span class="has-knowledge has-comments">${label}</span>`;
    }
    if (!isPlaceholder && status !== "完了") html += `<button class="urgent-btn" data-urgent="${path}" data-urgent-repo="${effectiveRepo}">⚡ 即実行</button>`;
    if (!isPlaceholder) html += `<button class="handoff-btn" data-handoff="${path}" data-handoff-repo="${effectiveRepo}">引継ぎ</button>`;
    html += `</div></div></div>`;

    if (node.manualSetup) {
      html += `<div class="manual-setup-panel"><div class="m-label">⚠ 手動設定が必要</div><div class="m-body">${node.manualSetup}</div></div>`;
    }
    if (detailOpen) {
      html += knowledgePanel(node);
      if (!isPlaceholder) html += commentThread(node, path, effectiveRepo);
    }

    if (hasChildren && groupOpen) {
      const pendingSubs = node.subtasks.filter(s => s.status !== "完了");
      const doneSubs = node.subtasks.filter(s => s.status === "完了");
      const activeTab = subtaskTabs.get(path) || "pending";
      const shown = activeTab === "done" ? doneSubs : pendingSubs;

      html += `<div class="subtask-tabs">`;
      html += `<button class="subtask-tab-btn${activeTab === "pending" ? " active" : ""}" data-subtask-tab="${path}:pending">未完了 (${pendingSubs.length})</button>`;
      html += `<button class="subtask-tab-btn${activeTab === "done" ? " active" : ""}" data-subtask-tab="${path}:done">完了 (${doneSubs.length})</button>`;
      html += `</div>`;

      if (!shown.length) {
        html += `<div class="empty small">${activeTab === "done" ? "完了した子タスクはありません" : "未完了の子タスクはありません"}</div>`;
      } else {
        html += shown.map(sub => renderRow(sub, `${path}.${node.subtasks.indexOf(sub)}`, { child: true, repo: effectiveRepo })).join("");
      }
    }
    return html;
  }

  function renderFeed() {
    const feed = document.getElementById("feed");
    let list = TASKS;
    if (activeFilter === "code") list = list.filter(isCode);
    if (activeFilter === "research") list = list.filter(t => !isCode(t));
    list = sortNodes(list);

    if (!list.length) {
      feed.innerHTML = `<div class="empty">タスクがありません</div>`;
      return;
    }

    // パスのルートは常に元のTASKS配列でのindexを使う(フィルタ/並び替えでlistの順序がTASKSとズレるため)
    feed.innerHTML = list.map((t) => `<div class="task-group">${renderRow(t, `${TASKS.indexOf(t)}`)}</div>`).join("");

    feed.querySelectorAll("[data-group-toggle]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const key = btn.dataset.groupToggle;
        if (openGroups.has(key)) openGroups.delete(key); else openGroups.add(key);
        renderFeed();
      });
    });
    feed.querySelectorAll("[data-subtask-tab]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const [path, tab] = btn.dataset.subtaskTab.split(":");
        subtaskTabs.set(path, tab);
        renderFeed();
      });
    });
    feed.querySelectorAll("[data-detail-toggle]").forEach(row => {
      const key = row.dataset.detailToggle;
      if (!key) return;
      row.addEventListener("click", () => {
        if (openDetails.has(key)) openDetails.delete(key); else openDetails.add(key);
        renderFeed();
      });
    });
    feed.querySelectorAll("[data-handoff]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const node = findNodeByPath(btn.dataset.handoff);
        showHandoffModal(buildHandoffText(node, btn.dataset.handoffRepo));
      });
    });
    feed.querySelectorAll("[data-add-parent]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        showAddTaskModal(btn.dataset.addParent, btn.dataset.addRepo);
      });
    });
    feed.querySelectorAll("[data-urgent]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        markTaskUrgent(btn.dataset.urgent, btn.dataset.urgentRepo);
      });
    });
    feed.querySelectorAll("[data-comment-input]").forEach(el => {
      el.addEventListener("click", (e) => e.stopPropagation());
    });
    feed.querySelectorAll("[data-comment-send]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const path = btn.dataset.commentSend;
        const textarea = feed.querySelector(`[data-comment-input="${path}"]`);
        const text = textarea.value.trim();
        if (!text) return;
        sendComment(path, btn.dataset.commentRepo, text);
      });
    });
    feed.querySelectorAll("[data-comment-urgent]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const path = btn.dataset.commentUrgent;
        const textarea = feed.querySelector(`[data-comment-input="${path}"]`);
        const text = textarea.value.trim();
        sendCommentAndMarkUrgent(path, btn.dataset.commentUrgentRepo, text);
      });
    });
  }

  function findNodeByPath(path) {
    const parts = path.split(".").map(Number);
    let node = TASKS[parts[0]];
    for (let i = 1; i < parts.length; i++) node = node.subtasks[parts[i]];
    return node;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buildHandoffText(node, repo) {
    const status = aggregateStatus(node);
    return [
      "【タスク引継ぎ】",
      `リポジトリ: ${repo}`,
      `タスク: ${node.task}`,
      `優先度: ${node.priority}`,
      `現在のステータス: ${status}`,
      `最終更新: ${node.updated}`,
      `備考: ${node.note || "(なし)"}`,
      "",
      "これまでの実装ナレッジ:",
      node.detail || "(まだ記録なし)",
      "",
      `成果物: ${node.output || "(なし)"}`,
      "",
      "---",
      "上記の状況を踏まえて、このタスクの実装を続けてください。不明点や問題があれば教えてください。",
    ].join("\n");
  }

  function showHandoffModal(text, title) {
    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <div class="modal-header">
            <h2>${title || "引継ぎプロンプト"}</h2>
            <button class="modal-close" id="modal-close" aria-label="閉じる">×</button>
          </div>
          <div class="modal-body">
            <textarea id="handoff-textarea" readonly>${escapeHtml(text)}</textarea>
          </div>
          <div class="modal-footer">
            <button class="modal-copy-btn" id="modal-copy-btn">コピー</button>
          </div>
        </div>
      </div>`;

    const closeModal = () => { root.innerHTML = ""; };
    document.getElementById("modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "modal-overlay") closeModal();
    });
    document.getElementById("modal-close").addEventListener("click", closeModal);

    document.getElementById("modal-copy-btn").addEventListener("click", async (e) => {
      const textarea = document.getElementById("handoff-textarea");
      textarea.select();
      let copied = false;
      try {
        await navigator.clipboard.writeText(textarea.value);
        copied = true;
      } catch (err) {
        try { copied = document.execCommand("copy"); } catch (err2) { copied = false; }
      }
      const btn = e.currentTarget;
      btn.textContent = copied ? "コピーしました ✓" : "コピー不可(手動で選択してください)";
      btn.classList.toggle("copied", copied);
      setTimeout(() => { btn.textContent = "コピー"; btn.classList.remove("copied"); }, 2000);
    });
  }

  function showAddTaskModal(parentPath, repo) {
    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <div class="modal-header">
            <h2>新規タスク追加(${repo})</h2>
            <button class="modal-close" id="modal-close" aria-label="閉じる">×</button>
          </div>
          <div class="modal-body">
            <div class="form-field">
              <label for="new-task-text">タスク内容</label>
              <input type="text" id="new-task-text" placeholder="例: ログイン画面の実装" />
            </div>
            <div class="form-field">
              <label for="new-task-priority">優先度</label>
              <select id="new-task-priority">
                <option value="高">高</option>
                <option value="中" selected>中</option>
                <option value="低">低</option>
              </select>
            </div>
            <div id="new-task-error" class="form-error"></div>
          </div>
          <div class="modal-footer">
            <button class="modal-cancel-btn" id="modal-cancel-btn">キャンセル</button>
            <button class="modal-submit-btn" id="modal-submit-btn">追加</button>
          </div>
        </div>
      </div>`;

    const closeModal = () => { root.innerHTML = ""; };
    document.getElementById("modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "modal-overlay") closeModal();
    });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal-cancel-btn").addEventListener("click", closeModal);

    document.getElementById("modal-submit-btn").addEventListener("click", () => {
      const textInput = document.getElementById("new-task-text");
      const task = textInput.value.trim();
      const priority = document.getElementById("new-task-priority").value;
      const errorEl = document.getElementById("new-task-error");
      if (!task) {
        errorEl.textContent = "タスク内容を入力してください";
        return;
      }
      addNewTask(parentPath, repo, task, priority);
      closeModal();
    });
  }

  function addNewTask(parentPath, repo, task, priority) {
    const parent = findNodeByPath(parentPath);
    if (!parent.subtasks) parent.subtasks = [];
    const today = new Date().toISOString().slice(0, 10);
    const newTask = { task, priority, status: "新規", updated: today, note: "", detail: "", output: "" };
    parent.subtasks.push(newTask);
    openGroups.add(parentPath);
    renderFeed();

    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        token: GAS_TOKEN,
        newTasks: [{ repo, task, priority, status: "対応中", requestedAt: today, note: "" }],
      }),
    })
      .then((res) => {
        if (!res.ok) throw new Error("sync failed");
        newTask.status = "対応中";
        renderFeed();
      })
      .catch(() => {
        newTask.note = "スプレッドシートへの自動同期に失敗しました。お手数ですが手動で追加してください。";
        renderFeed();
      });
  }

  function markTaskUrgent(path, repo, extraText) {
    const node = findNodeByPath(path);
    node.urgent = true;
    renderFeed();

    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: GAS_TOKEN, markUrgent: [{ repo, task: node.task }] }),
    }).catch(() => { /* スプレッドシート側への反映は失敗してもチャットでの依頼で代替できる */ });

    const text = [
      "【即実行の依頼】",
      `リポジトリ: ${repo}`,
      `タスク: ${node.task}`,
      `優先度: ${node.priority}`,
      `備考: ${extraText || node.note || "(なし)"}`,
      "",
      "このタスクを次回の定期実行を待たず、今すぐ実行してください。",
    ].join("\n");
    showHandoffModal(text, "即実行 依頼文");
  }

  // コメント欄からの「即実行」: 入力中のテキストをまずコメントとして記録し、
  // それを備考に含めた即実行の依頼文を作成する(送信ボタンとの違いを明確にするため)。
  function sendCommentAndMarkUrgent(path, repo, text) {
    if (text) sendComment(path, repo, text);
    markTaskUrgent(path, repo, text);
  }

  function sendComment(path, repo, text) {
    const node = findNodeByPath(path);
    if (!node.comments) node.comments = [];
    const at = new Date().toISOString().slice(0, 16).replace("T", " ");
    node.comments.push({ author: "user", text, at });
    openDetails.add(path);
    renderFeed();

    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        token: GAS_TOKEN,
        addComment: [{ repo, task: node.task, text, author: "user", at }],
      }),
    }).catch(() => { /* 同期に失敗しても、次回Routine実行時にこのダッシュボードのdata/tasks.json経由で拾われる */ });
  }

  function mergeSheetTasksIntoView(pendingRows) {
    let addedCount = 0;
    pendingRows.forEach((row) => {
      const repo = row.repo;
      const isTrue = (v) => v === true || v === "TRUE" || v === "true";
      let parent = TASKS.find((t) => t.repo === repo);
      if (!parent) {
        parent = { repo, task: `(${repo}向けタスク)`, priority: "-", status: "未着手", updated: "-", note: "", detail: "", output: "", subtasks: [] };
        TASKS.push(parent);
      }
      if (!parent.subtasks) parent.subtasks = [];
      const exists = parent.subtasks.some((s) => s.task === row.task) || parent.task === row.task;
      if (!exists && row.task) {
        parent.subtasks.push({
          task: row.task,
          priority: row.priority || "-",
          status: row.status || "未着手",
          updated: row.requestedAt || "-",
          note: row.note || "",
          detail: "",
          output: "",
          urgent: isTrue(row.urgent),
        });
        addedCount++;
      }
    });
    return addedCount;
  }

  // repo+taskで該当ノード(親タスクまたは子タスク)を探す。コメントの突き合わせに使う。
  function findNodeByRepoTask(repo, task) {
    for (const t of TASKS) {
      if (t.repo !== repo) continue;
      if (t.task === task) return t;
      if (t.subtasks) {
        const hit = t.subtasks.find((s) => s.task === task);
        if (hit) return hit;
      }
    }
    return null;
  }

  // GASの「コメント」タブから取得したコメント行([{repo, task, author, text, at}, ...])を
  // 対応するタスク/子タスクのcomments配列にマージする(GAS未対応の間はdata.commentsが無いので何もしない)。
  function mergeCommentsIntoView(commentRows) {
    commentRows.forEach((c) => {
      const node = findNodeByRepoTask(c.repo, c.task);
      if (!node || !c.text) return;
      if (!node.comments) node.comments = [];
      const exists = node.comments.some((existing) => existing.at === c.at && existing.text === c.text && existing.author === c.author);
      if (!exists) node.comments.push({ author: c.author || "user", text: c.text, at: c.at || "" });
    });
  }

  function refreshFromSheet(silent) {
    const btn = document.getElementById("refresh-btn");
    const original = btn.textContent;
    if (!silent) {
      btn.disabled = true;
      btn.textContent = "更新中...";
    }

    fetch(`${GAS_URL}?action=list`)
      .then((res) => {
        if (!res.ok) throw new Error("fetch failed");
        return res.json();
      })
      .then((data) => {
        const added = mergeSheetTasksIntoView(data.pending || []);
        mergeCommentsIntoView(data.comments || []);
        renderStats();
        renderFeed();
        if (silent) return;
        btn.textContent = added > 0 ? `✓ ${added}件追加` : "✓ 変化なし";
      })
      .catch(() => {
        if (!silent) btn.textContent = "更新失敗";
      })
      .finally(() => {
        if (silent) return;
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2500);
      });
  }

  function showRoutineSettingsModal() {
    const root = document.getElementById("modal-root");
    root.innerHTML = `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <div class="modal-header">
            <h2>Routine設定を変更</h2>
            <button class="modal-close" id="modal-close" aria-label="閉じる">×</button>
          </div>
          <div class="modal-body">
            <div class="settings-note">
              <p><b>この設定はここでは自動反映されません。</b></p>
              <p>Claude Codeのセッション(Routine)のスケジュールを書き換える公開APIがこのページから呼べないため、ダッシュボード側だけでは変更を完結できません。</p>
              <p>下のフォームに希望を入力して「依頼文を作成」を押すと、変更依頼のテキストが生成されます。それをコピーして、Routineを動かしているClaude Codeのチャット(このセッション)に貼り付けてください。貼り付けた内容を私が読み取り、実際のRoutine設定(実行頻度・時刻)をその場で変更します。</p>
            </div>
            <div class="form-field">
              <label for="routine-freq">1日の実行回数</label>
              <select id="routine-freq">
                <option value="1" selected>1回</option>
                <option value="2">2回</option>
                <option value="3">3回</option>
                <option value="4">4回</option>
              </select>
            </div>
            <div class="form-field">
              <label for="routine-times">実行時刻(JST、カンマ区切り。回数分入力)</label>
              <input type="text" id="routine-times" placeholder="例: 9:00 または 9:00,12:00,15:00,18:00" />
            </div>
            <div class="form-field">
              <label for="routine-days">曜日</label>
              <select id="routine-days">
                <option value="平日(月〜金)" selected>平日(月〜金)</option>
                <option value="毎日">毎日</option>
              </select>
            </div>
            <div id="routine-settings-error" class="form-error"></div>
          </div>
          <div class="modal-footer">
            <button class="modal-cancel-btn" id="modal-cancel-btn">キャンセル</button>
            <button class="modal-submit-btn" id="modal-generate-btn">依頼文を作成</button>
          </div>
        </div>
      </div>`;

    const closeModal = () => { root.innerHTML = ""; };
    document.getElementById("modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "modal-overlay") closeModal();
    });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal-cancel-btn").addEventListener("click", closeModal);

    document.getElementById("modal-generate-btn").addEventListener("click", () => {
      const freq = document.getElementById("routine-freq").value;
      const times = document.getElementById("routine-times").value.trim();
      const days = document.getElementById("routine-days").value;
      const errorEl = document.getElementById("routine-settings-error");
      const timeList = times.split(",").map((t) => t.trim()).filter(Boolean);
      if (timeList.length !== Number(freq)) {
        errorEl.textContent = `実行回数(${freq}回)と時刻の数(${timeList.length}個)を一致させてください`;
        return;
      }
      const text = [
        "【Routine設定変更】",
        `実行頻度: 1日${freq}回`,
        `実行曜日: ${days}`,
        `実行時刻(JST): ${timeList.join(", ")}`,
        "",
        "上記の内容でRoutineのスケジュール(cron_expression)を変更してください。",
      ].join("\n");
      showHandoffModal(text, "設定変更 依頼文");
    });
  }

  document.getElementById("open-settings-btn").addEventListener("click", showRoutineSettingsModal);
  document.getElementById("refresh-btn").addEventListener("click", () => refreshFromSheet(false));

  renderStats();
  renderFilters();
  renderFeed();
  // ページを開いた時点で、他の人やRoutineが書き込んだ最新のコメント・新規タスクを静かに取り込む
  refreshFromSheet(true);
</script>

<title>実装進捗ダッシュボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --surface-2: #eceef3;
    --border: #dcdfe6;
    --text: #1b1e27;
    --text-muted: #5b6172;
    --accent: #33449c;
    --accent-soft: #e4e7fb;
    --status-done-bg: #e1f5ec;
    --status-done-fg: #157a4a;
    --status-doing-bg: #e4edfd;
    --status-doing-fg: #2054c4;
    --status-todo-bg: #eceef3;
    --status-todo-fg: #5b6172;
    --status-skip-bg: #fdf0e0;
    --status-skip-fg: #a05a08;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --surface: #1b1e27;
      --surface-2: #22252f;
      --border: #30333e;
      --text: #e7e8ee;
      --text-muted: #969cab;
      --accent: #8fa1ff;
      --accent-soft: #262b45;
      --status-done-bg: #143528;
      --status-done-fg: #4fd399;
      --status-doing-bg: #17263f;
      --status-doing-fg: #7fabfd;
      --status-todo-bg: #22252f;
      --status-todo-fg: #969cab;
      --status-skip-bg: #3a2a10;
      --status-skip-fg: #f0a94e;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c;
    --surface: #1b1e27;
    --surface-2: #22252f;
    --border: #30333e;
    --text: #e7e8ee;
    --text-muted: #969cab;
    --accent: #8fa1ff;
    --accent-soft: #262b45;
    --status-done-bg: #143528;
    --status-done-fg: #4fd399;
    --status-doing-bg: #17263f;
    --status-doing-fg: #7fabfd;
    --status-todo-bg: #22252f;
    --status-todo-fg: #969cab;
    --status-skip-bg: #3a2a10;
    --status-skip-fg: #f0a94e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --surface-2: #eceef3;
    --border: #dcdfe6;
    --text: #1b1e27;
    --text-muted: #5b6172;
    --accent: #33449c;
    --accent-soft: #e4e7fb;
    --status-done-bg: #e1f5ec;
    --status-done-fg: #157a4a;
    --status-doing-bg: #e4edfd;
    --status-doing-fg: #2054c4;
    --status-todo-bg: #eceef3;
    --status-todo-fg: #5b6172;
    --status-skip-bg: #fdf0e0;
    --status-skip-fg: #a05a08;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.06);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
    padding: 28px 20px 64px;
  }

  .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

  header { display: flex; flex-direction: column; gap: 4px; }
  header .eyebrow {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 600;
  }
  header h1 { margin: 0; font-size: 26px; font-weight: 700; text-wrap: balance; }
  header .meta { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  header .meta a { color: var(--accent); text-decoration: none; }
  header .meta a:hover { text-decoration: underline; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 10px;
  }
  .stat-card .repo-name {
    font-weight: 700; font-size: 15px; word-break: break-word;
  }
  .stat-card .progress-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .stat-card .progress-pct {
    font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent);
  }
  .stat-card .progress-frac { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .bar-track {
    height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden;
  }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums;
  }
  .chip.done { background: var(--status-done-bg); color: var(--status-done-fg); }
  .chip.doing { background: var(--status-doing-bg); color: var(--status-doing-fg); }
  .chip.todo { background: var(--status-todo-bg); color: var(--status-todo-fg); }
  .chip.skip { background: var(--status-skip-bg); color: var(--status-skip-fg); }

  section.tasks { display: flex; flex-direction: column; gap: 14px; }
  section.tasks h2 { font-size: 15px; margin: 0; color: var(--text-muted); font-weight: 700; letter-spacing: 0.02em; }

  .repo-block {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .repo-block .repo-header {
    padding: 12px 16px; font-weight: 700; font-size: 14px;
    border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  table { width: 100%; border-collapse: collapse; }
  .table-scroll { overflow-x: auto; }
  th, td { text-align: left; padding: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  td.priority { font-variant-numeric: tabular-nums; }
  td.updated { color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.note { color: var(--text-muted); }

  footer { color: var(--text-muted); font-size: 12px; text-align: center; padding-top: 8px; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Progress Tracker</div>
    <h1>実装進捗ダッシュボード</h1>
    <div class="meta">
      最終更新: <span id="updated-at">2026-07-26</span> ・
      データ元: <a href="https://docs.google.com/spreadsheets/d/1679CPPuWq4lciwe4BsJTfjJpiZKvKWogETwtauPThYw/edit" target="_blank" rel="noopener">実装進捗管理シート</a>
    </div>
  </header>

  <div id="stat-grid" class="stat-grid"></div>

  <section class="tasks">
    <h2>コード実装</h2>
    <div id="code-blocks" style="display:flex; flex-direction:column; gap:14px;"></div>
  </section>

  <section class="tasks">
    <h2>調査・資料作成</h2>
    <div id="research-block" style="display:flex; flex-direction:column; gap:14px;"></div>
  </section>

  <footer>Routineが定期実行のたびにこのダッシュボードを更新します</footer>
</div>

<script>
  // データはRoutine実行のたびにここを更新する(スプレッドシートの内容と同期)
  // Repo欄が既知のリポジトリ名ならコード実装タスク、それ以外(例: 調査, 資料作成)は調査・資料作成タスクとして扱う
  const KNOWN_REPOS = ["progress-tracker-dashboard", "kizashi", "supermarket-price-tracker"];

  const TASKS = [
    { repo: "progress-tracker-dashboard", task: "初期セットアップ(スプレッドシート・ダッシュボード雛形作成)", priority: "高", status: "完了", updated: "2026-07-26", note: "Routine構築はこの後", output: "" },
    { repo: "kizashi", task: "(タスク未登録)", priority: "-", status: "未着手", updated: "-", note: "スプレッドシートにタスクを追加してください", output: "" },
    { repo: "supermarket-price-tracker", task: "(タスク未登録)", priority: "-", status: "未着手", updated: "-", note: "スプレッドシートにタスクを追加してください", output: "" }
  ];

  const codeTasks = TASKS.filter(t => KNOWN_REPOS.includes(t.repo));
  const researchTasks = TASKS.filter(t => !KNOWN_REPOS.includes(t.repo));

  const STATUS_CLASS = { "完了": "done", "進行中": "doing", "未着手": "todo", "スキップ": "skip" };

  function chip(status) {
    const cls = STATUS_CLASS[status] || "todo";
    return `<span class="chip ${cls}">${status}</span>`;
  }

  function groupByRepo(tasks) {
    const map = new Map();
    tasks.forEach(t => {
      if (!map.has(t.repo)) map.set(t.repo, []);
      map.get(t.repo).push(t);
    });
    return [...map.entries()].map(([repo, tasks]) => ({ repo, tasks }));
  }

  function renderStats() {
    const grid = document.getElementById("stat-grid");
    const groups = groupByRepo(codeTasks);
    const cards = groups.map(g => {
      const total = g.tasks.length;
      const done = g.tasks.filter(t => t.status === "完了").length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const counts = g.tasks.reduce((acc, t) => { acc[t.status] = (acc[t.status] || 0) + 1; return acc; }, {});
      const chips = Object.entries(counts)
        .map(([status, n]) => `${chip(status)}<span style="font-size:11px;color:var(--text-muted)">×${n}</span>`)
        .join("");
      return `
        <div class="stat-card">
          <div class="repo-name">${g.repo}</div>
          <div class="progress-row">
            <span class="progress-pct">${pct}%</span>
            <span class="progress-frac">${done}/${total} 完了</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="chip-row">${chips}</div>
        </div>`;
    });

    const rTotal = researchTasks.length;
    const rDone = researchTasks.filter(t => t.status === "完了").length;
    const rPct = rTotal ? Math.round((rDone / rTotal) * 100) : 0;
    if (rTotal) {
      cards.push(`
        <div class="stat-card">
          <div class="repo-name">調査・資料作成</div>
          <div class="progress-row">
            <span class="progress-pct">${rPct}%</span>
            <span class="progress-frac">${rDone}/${rTotal} 完了</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${rPct}%"></div></div>
        </div>`);
    }
    grid.innerHTML = cards.join("");
  }

  function taskTable(tasks, { showOutput } = {}) {
    return `
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>タスク</th><th>優先度</th><th>ステータス</th><th>最終更新</th>
              ${showOutput ? "<th>成果物</th>" : ""}
              <th>備考</th>
            </tr>
          </thead>
          <tbody>
            ${tasks.map(t => `
              <tr>
                <td>${t.task}</td>
                <td class="priority">${t.priority}</td>
                <td>${chip(t.status)}</td>
                <td class="updated">${t.updated}</td>
                ${showOutput ? `<td class="note">${t.output ? `<a href="${t.output}" target="_blank" rel="noopener">リンク</a>` : "-"}</td>` : ""}
                <td class="note">${t.note}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
  }

  function renderCodeBlocks() {
    const wrap = document.getElementById("code-blocks");
    const groups = groupByRepo(codeTasks);
    wrap.innerHTML = groups.map(g => `
      <div class="repo-block">
        <div class="repo-header">${g.repo}</div>
        ${taskTable(g.tasks)}
      </div>`).join("") || `<div class="repo-block"><div class="repo-header">タスクなし</div></div>`;
  }

  function renderResearchBlock() {
    const wrap = document.getElementById("research-block");
    if (!researchTasks.length) {
      wrap.innerHTML = `<div class="repo-block"><div class="repo-header">タスクなし</div></div>`;
      return;
    }
    wrap.innerHTML = `<div class="repo-block">${taskTable(researchTasks, { showOutput: true })}</div>`;
  }

  renderStats();
  renderCodeBlocks();
  renderResearchBlock();
</script>

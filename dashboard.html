<title>実装進捗ダッシュボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --surface-2: #eceef3;
    --border: #dcdfe6;
    --text: #1b1e27;
    --text-muted: #5b6172;
    --accent: #33449c;
    --accent-soft: #e4e7fb;
    --status-done-bg: #e1f5ec;
    --status-done-fg: #157a4a;
    --status-doing-bg: #e4edfd;
    --status-doing-fg: #2054c4;
    --status-todo-bg: #eceef3;
    --status-todo-fg: #5b6172;
    --status-skip-bg: #fdf0e0;
    --status-skip-fg: #a05a08;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --surface: #1b1e27; --surface-2: #22252f; --border: #30333e;
      --text: #e7e8ee; --text-muted: #969cab; --accent: #8fa1ff; --accent-soft: #262b45;
      --status-done-bg: #143528; --status-done-fg: #4fd399;
      --status-doing-bg: #17263f; --status-doing-fg: #7fabfd;
      --status-todo-bg: #22252f; --status-todo-fg: #969cab;
      --status-skip-bg: #3a2a10; --status-skip-fg: #f0a94e;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --surface: #1b1e27; --surface-2: #22252f; --border: #30333e;
    --text: #e7e8ee; --text-muted: #969cab; --accent: #8fa1ff; --accent-soft: #262b45;
    --status-done-bg: #143528; --status-done-fg: #4fd399;
    --status-doing-bg: #17263f; --status-doing-fg: #7fabfd;
    --status-todo-bg: #22252f; --status-todo-fg: #969cab;
    --status-skip-bg: #3a2a10; --status-skip-fg: #f0a94e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --bg: #f3f4f7; --surface: #ffffff; --surface-2: #eceef3; --border: #dcdfe6;
    --text: #1b1e27; --text-muted: #5b6172; --accent: #33449c; --accent-soft: #e4e7fb;
    --status-done-bg: #e1f5ec; --status-done-fg: #157a4a;
    --status-doing-bg: #e4edfd; --status-doing-fg: #2054c4;
    --status-todo-bg: #eceef3; --status-todo-fg: #5b6172;
    --status-skip-bg: #fdf0e0; --status-skip-fg: #a05a08;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.06);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5; padding: 24px 0 64px;
  }

  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 0 16px; }

  header { display: flex; flex-direction: column; gap: 4px; }
  header .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
  header .meta { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  header .meta a { color: var(--accent); text-decoration: none; }
  header .meta a:hover { text-decoration: underline; }

  .stat-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .stat-pill {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px 6px 6px; box-shadow: var(--shadow); white-space: nowrap;
  }
  .stat-pill .avatar { width: 22px; height: 22px; }
  .stat-pill .name { font-size: 12px; font-weight: 700; }
  .stat-pill .pct { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }

  .avatar {
    width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
  }

  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    cursor: pointer;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .feed {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .feed-row { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .feed-row:last-child { border-bottom: none; }
  .feed-row .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .feed-row .top-line { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .feed-row .repo-tag { font-weight: 700; font-size: 13px; }
  .feed-row .type-tag { font-size: 11px; color: var(--text-muted); }
  .feed-row .task-text { font-size: 13.5px; color: var(--text); }
  .feed-row .task-text.muted { color: var(--text-muted); font-style: italic; }
  .feed-row .meta-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .feed-row .note { font-size: 12px; color: var(--text-muted); }
  .feed-row .note a { color: var(--accent); text-decoration: none; }
  .feed-row .note a:hover { text-decoration: underline; }

  .chip {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.done { background: var(--status-done-bg); color: var(--status-done-fg); }
  .chip.doing { background: var(--status-doing-bg); color: var(--status-doing-fg); }
  .chip.todo { background: var(--status-todo-bg); color: var(--status-todo-fg); }
  .chip.skip { background: var(--status-skip-bg); color: var(--status-skip-fg); }

  .empty { padding: 28px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

  footer { color: var(--text-muted); font-size: 12px; text-align: center; padding-top: 4px; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Progress Tracker</div>
    <h1>実装進捗ダッシュボード</h1>
    <div class="meta">
      最終更新: <span id="updated-at">2026-07-26</span> ・
      データ元: <a href="https://docs.google.com/spreadsheets/d/1679CPPuWq4lciwe4BsJTfjJpiZKvKWogETwtauPThYw/edit" target="_blank" rel="noopener">実装進捗管理シート</a>
    </div>
  </header>

  <div id="stat-strip" class="stat-strip"></div>

  <div id="filter-row" class="filter-row"></div>

  <div id="feed" class="feed"></div>

  <footer>Routineが定期実行のたびにこのダッシュボードを更新します</footer>
</div>

<script>
  // データはRoutine実行のたびにここを更新する(スプレッドシートの内容と同期)
  // Repo欄が既知のリポジトリ名ならコード実装タスク、それ以外(例: 調査, 資料作成)は調査・資料作成タスクとして扱う
  const KNOWN_REPOS = ["progress-tracker-dashboard", "kizashi", "supermarket-price-tracker"];

  const TASKS = [
    { repo: "progress-tracker-dashboard", task: "初期セットアップ(スプレッドシート・ダッシュボード雛形作成)", priority: "高", status: "完了", updated: "2026-07-26", note: "Routine構築はこの後", output: "" },
    { repo: "kizashi", task: "(タスク未登録)", priority: "-", status: "未着手", updated: "-", note: "スプレッドシートにタスクを追加してください", output: "" },
    { repo: "supermarket-price-tracker", task: "(タスク未登録)", priority: "-", status: "未着手", updated: "-", note: "スプレッドシートにタスクを追加してください", output: "" }
  ];

  const STATUS_CLASS = { "完了": "done", "進行中": "doing", "未着手": "todo", "スキップ": "skip" };
  const STATUS_ORDER = ["進行中", "未着手", "スキップ", "完了"];
  const PRIORITY_ORDER = { "高": 0, "中": 1, "低": 2, "-": 3 };

  const REPO_COLORS = {
    "progress-tracker-dashboard": "#33449c",
    "kizashi": "#c2410c",
    "supermarket-price-tracker": "#0f766e",
  };
  const RESEARCH_COLOR = "#7c3aed";

  function isCode(t) { return KNOWN_REPOS.includes(t.repo); }
  function avatarColor(t) { return isCode(t) ? (REPO_COLORS[t.repo] || "#5b6172") : RESEARCH_COLOR; }
  function avatarLabel(t) { return isCode(t) ? "💻" : "📝"; }

  function chip(status) {
    const cls = STATUS_CLASS[status] || "todo";
    return `<span class="chip ${cls}">${status}</span>`;
  }

  function sortedTasks(list) {
    return [...list].sort((a, b) => {
      const s = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
      if (s !== 0) return s;
      return (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9);
    });
  }

  function renderStats() {
    const strip = document.getElementById("stat-strip");
    const repos = [...new Set(TASKS.filter(isCode).map(t => t.repo))];
    const pills = repos.map(repo => {
      const tasks = TASKS.filter(t => t.repo === repo);
      const total = tasks.length;
      const done = tasks.filter(t => t.status === "完了").length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const color = REPO_COLORS[repo] || "#5b6172";
      return `
        <div class="stat-pill">
          <div class="avatar" style="width:22px;height:22px;font-size:11px;background:${color}">${repo.slice(0, 2).toUpperCase()}</div>
          <span class="name">${repo}</span>
          <span class="pct">${pct}%</span>
        </div>`;
    });
    const research = TASKS.filter(t => !isCode(t));
    if (research.length) {
      const done = research.filter(t => t.status === "完了").length;
      const pct = Math.round((done / research.length) * 100);
      pills.push(`
        <div class="stat-pill">
          <div class="avatar" style="width:22px;height:22px;font-size:11px;background:${RESEARCH_COLOR}">📝</div>
          <span class="name">調査・資料</span>
          <span class="pct">${pct}%</span>
        </div>`);
    }
    strip.innerHTML = pills.join("");
  }

  let activeFilter = "all";

  function renderFilters() {
    const row = document.getElementById("filter-row");
    const options = [
      ["all", "すべて"],
      ["code", "💻 コード実装"],
      ["research", "📝 調査・資料作成"],
    ];
    row.innerHTML = options.map(([key, label]) =>
      `<button class="filter-btn${activeFilter === key ? " active" : ""}" data-filter="${key}">${label}</button>`
    ).join("");
    row.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        renderFilters();
        renderFeed();
      });
    });
  }

  function renderFeed() {
    const feed = document.getElementById("feed");
    let list = TASKS;
    if (activeFilter === "code") list = list.filter(isCode);
    if (activeFilter === "research") list = list.filter(t => !isCode(t));
    list = sortedTasks(list);

    if (!list.length) {
      feed.innerHTML = `<div class="empty">タスクがありません</div>`;
      return;
    }

    feed.innerHTML = list.map(t => {
      const color = avatarColor(t);
      const isPlaceholder = t.task.startsWith("(");
      return `
        <div class="feed-row">
          <div class="avatar" style="background:${color}">${avatarLabel(t)}</div>
          <div class="content">
            <div class="top-line">
              <span class="repo-tag">${t.repo}</span>
              <span class="type-tag">${isCode(t) ? "コード実装" : "調査・資料作成"}</span>
            </div>
            <div class="task-text${isPlaceholder ? " muted" : ""}">${t.task}</div>
            <div class="meta-line">
              ${chip(t.status)}
              ${t.priority !== "-" ? `<span>優先度: ${t.priority}</span>` : ""}
              ${t.updated !== "-" ? `<span>${t.updated}</span>` : ""}
              ${t.output ? `<a href="${t.output}" target="_blank" rel="noopener">成果物を見る</a>` : ""}
            </div>
            ${t.note ? `<div class="note">${t.note}</div>` : ""}
          </div>
        </div>`;
    }).join("");
  }

  renderStats();
  renderFilters();
  renderFeed();
</script>
